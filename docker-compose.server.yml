# 게임 서버 스택 — 서버 하나 = 독립 게임 월드 1개
# 외부 public id는 [A-Za-z0-9]+를 받지만 control plane이 소문자 [a-z0-9]+로 정규화한 SERVER_ID만 compose에 넘긴다(예: PEP→pep).
# 내부 Docker key는 s${SERVER_ID}(=spep)다.
# 프로젝트명: opensamguk-s${SERVER_ID} (서버마다 다름)
# 기동: docker compose -p opensamguk-spep -f docker-compose.server.yml --env-file servers/spep.env up -d
#
# 서버별로 격리되는 것:
#   - game-postgres / game-redis : 그 서버 월드의 영속화 + 큐
#   - game-engine                : 그 월드의 InMemoryTurnWorld(source of truth)
#   - game-api                   : 그 서버 read/precheck/intake/SSE
#   - web-game                   : 그 서버 게임 프론트
#   - IMAGE_TAG                   : 서버마다 다른 버전 고정 가능
#
# 공유 스택(gateway/web-gateway/nginx/deployer)은 docker-compose.shared.yml에서 별도 기동.
# 모든 컨테이너 이름은 s${SERVER_ID} 프리픽스(예: spep-game-api) — 내부 레지스트리 URL과 일치해야 함.
name: opensamguk-s${SERVER_ID}

services:
  # 그 서버 월드의 영속화 DB. 서버마다 독립 볼륨.
  game-postgres:
    image: postgres:16-alpine
    container_name: s${SERVER_ID}-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAME_POSTGRES_DB:-sammo}
      POSTGRES_USER: ${GAME_POSTGRES_USER:-sammo}
      POSTGRES_PASSWORD: ${GAME_POSTGRES_PASSWORD:?GAME_POSTGRES_PASSWORD required}
    volumes:
      - game-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAME_POSTGRES_USER:-sammo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 1.5G

  game-redis:
    image: redis:7-alpine
    container_name: s${SERVER_ID}-game-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - game-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 300M

  # 턴 데몬 — 그 월드의 source of truth. deployer 자동 재배포에서 제외(진행 중 desync 방지).
  # gateway-api/deployer를 참조하지 않는다(독립). 업데이트는 운영자 수동 bounce만.
  game-engine:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-peppone-choi}/opensamguk:game-engine-${IMAGE_TAG:-latest}
    container_name: s${SERVER_ID}-game-engine
    restart: unless-stopped
    environment:
      GAME_DATABASE_URL: jdbc:postgresql://s${SERVER_ID}-game-postgres:5432/${GAME_POSTGRES_DB:-sammo}
      GAME_DB_USER: ${GAME_POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${GAME_POSTGRES_PASSWORD:?GAME_POSTGRES_PASSWORD required}
      REDIS_HOST: s${SERVER_ID}-game-redis
      REDIS_PORT: 6379
      TURN_PROFILE_NAME: ${TURN_PROFILE_NAME:-che:scenario_2}
      OPENSAMGUK_WORLD_ID: ${OPENSAMGUK_WORLD_ID:-1}
      # 시나리오 시드(빈 world_state에서 1회 멱등) — scenario_1010 = 174 generals.
      SCENARIO_SEED_ENABLED: ${SCENARIO_SEED_ENABLED:-true}
      SCENARIO_CODE: ${SCENARIO_CODE:-scenario_1010}
      SCENARIO_DIR: ${SCENARIO_DIR:-/data/scenarios}
      # 리셋이 고른 턴 주기(분). deployer가 servers/<id>.env에 RESET_TURNTERM으로 쓰고
      # (main.go resetEnvUpdates), compose는 --env-file로 그 파일을 읽는다. 이 한 줄이 없으면
      # 값이 env 파일까지만 오고 엔진에 닿지 않아 시드가 항상 60분으로 굳는다.
      # 기본값을 비워 두는 것은 의도적이다 — 미설정의 의미(60분)는 게임 엔진
      # (SeedBootstrap.DEFAULT_TURN_TERM)이 단독으로 소유해야 두 곳이 갈라지지 않는다.
      RESET_TURNTERM: ${RESET_TURNTERM:-}
      # 같은 리셋이 고른 나머지 시나리오 옵션. 위와 같은 이유로 기본값을 비워 둔다 —
      # 미설정의 의미(PHP install.php 기본값)는 게임 엔진(SeedBootstrap의 PHP_DEFAULT_*)이
      # 단독으로 소유해야 compose와 엔진이 갈라지지 않는다.
      RESET_FICTION: ${RESET_FICTION:-}
      RESET_EXTEND: ${RESET_EXTEND:-}
      RESET_BLOCK_GENERAL_CREATE: ${RESET_BLOCK_GENERAL_CREATE:-}
      RESET_NPCMODE: ${RESET_NPCMODE:-}
      RESET_SHOW_IMG_LEVEL: ${RESET_SHOW_IMG_LEVEL:-}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=40.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      game-postgres:
        condition: service_healthy
      game-redis:
        condition: service_healthy
    expose:
      - "8082"
    volumes:
      # 호스트 절대경로로 바인드한다. deployer는 컨테이너(/workspace) 안에서 compose를 실행하므로
      # 상대경로는 호스트 데몬에 `/workspace/data/...` 문자열로 전달되고, 데몬이 그걸 호스트 경로로
      # 해석해 빈 디렉터리를 만든다(= 외부 오버라이드가 조용히 무력화). nginx 바인드와 동일 패턴.
      - ${COMPOSE_HOST_DIR:-${PWD:-.}}/data/scenarios:${SCENARIO_DIR:-/data/scenarios}:ro
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 2G

  # 그 서버 read/precheck/intake/SSE. 스테이트리스 — deployer가 bounce로 갱신.
  game-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-peppone-choi}/opensamguk:game-api-${IMAGE_TAG:-latest}
    container_name: s${SERVER_ID}-game-api
    restart: unless-stopped
    environment:
      GAME_DATABASE_URL: jdbc:postgresql://s${SERVER_ID}-game-postgres:5432/${GAME_POSTGRES_DB:-sammo}
      GAME_DB_USER: ${GAME_POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${GAME_POSTGRES_PASSWORD:?GAME_POSTGRES_PASSWORD required}
      REDIS_HOST: s${SERVER_ID}-game-redis
      REDIS_PORT: 6379
      OPENSAMGUK_PROFILE: ${TURN_PROFILE_NAME:-che:scenario_2}
      SERVER_ID: ${SERVER_ID}
      SERVER_NAME: ${SERVER_NAME:-}
      SERVER_GENERATION: ${SERVER_GENERATION:-1}
      OPENSAMGUK_WORLD_ID: ${OPENSAMGUK_WORLD_ID:-1}
      SCENARIO_DIR: ${SCENARIO_DIR:-/data/scenarios}
      # JWT — game-api는 gateway-api 공개키로 검증만 한다(verify-only, 개인키 미배포).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required — see .env.example}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_LEGACY_ACCESS_ACCEPT_UNTIL: ${JWT_LEGACY_ACCESS_ACCEPT_UNTIL:-}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=30.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      game-postgres:
        condition: service_healthy
      game-redis:
        condition: service_healthy
    expose:
      - "8081"
    volumes:
      # 호스트 절대경로로 바인드한다. deployer는 컨테이너(/workspace) 안에서 compose를 실행하므로
      # 상대경로는 호스트 데몬에 `/workspace/data/...` 문자열로 전달되고, 데몬이 그걸 호스트 경로로
      # 해석해 빈 디렉터리를 만든다(= 외부 오버라이드가 조용히 무력화). nginx 바인드와 동일 패턴.
      - ${COMPOSE_HOST_DIR:-${PWD:-.}}/data/scenarios:${SCENARIO_DIR:-/data/scenarios}:ro
    # 외부에서 로비(로비 servers.json의 절대 URL)가 직접 도달하도록 호스트 포트 노출.
    ports:
      - "${GAME_API_PORT:?GAME_API_PORT required}:8081"
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 1.5G

  # 그 서버 게임 프론트. 스테이트리스지만 서버 env의 태그 핀은 보존되며, 승격은 명시 운영으로만 수행한다.
  # WEB_GAME_TAG(프론트 전용)로 game-api/engine의 IMAGE_TAG 핀과 독립 갱신 — 미설정 시 IMAGE_TAG로 폴백.
  web-game:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-peppone-choi}/opensamguk:web-game-${WEB_GAME_TAG:-${IMAGE_TAG:-latest}}
    container_name: s${SERVER_ID}-web-game
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVER_ID: ${SERVER_ID}
      # 서버 전용 프록시 타깃 — 그 서버 game-api를 가리킨다.
      GAME_API_URL: ${GAME_API_URL:-http://s${SERVER_ID}-game-api:8081}
      # 게이트웨이는 공유 스택 — 내부 DNS로 도달(같은 opensamguk-net).
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway-api:8080}
    depends_on:
      - game-api
      - game-engine
    expose:
      - "3001"
    # 게임 진입은 로비 servers.json의 절대 URL이 담당 — 서버별 호스트 포트로 노출.
    ports:
      - "${WEB_GAME_PORT:?WEB_GAME_PORT required}:3001"
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  # 서버별 분리 볼륨 — 프로젝트명(opensamguk-s${SERVER_ID})으로도 격리되지만 이름도 분리.
  game-pgdata:
    name: s${SERVER_ID}-game-pgdata
    driver: local
  game-redisdata:
    name: s${SERVER_ID}-game-redisdata
    driver: local

networks:
  # 공유 스택과 동일한 외부 네트워크 — gateway/nginx/deployer와 같은 망에서 통신.
  opensamguk-net:
    external: true
