events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    upstream gateway_api {
        server gateway-api:8080;
        keepalive 32;
    }
    upstream web_gateway {
        server web-gateway:3000;
        keepalive 32;
    }
    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    map $uri $game_path_web_upstream {
        default "";
        ~^/game/(?<path_public_server_id>[A-Za-z0-9]+)(?:/|$) http://s${path_public_server_id}-web-game:3001;
    }
    map $cookie_sam_server $game_cookie_web_upstream {
        default "";
        ~^(?<cookie_web_public_server_id>[A-Za-z0-9]+)$ http://s${cookie_web_public_server_id}-web-game:3001;
    }
    map $cookie_sam_server $game_cookie_api_upstream {
        default "";
        ~^(?<cookie_api_public_server_id>[A-Za-z0-9]+)$ http://s${cookie_api_public_server_id}-game-api:8081;
    }

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /api/admin/ {
            if ($game_cookie_api_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_api_upstream;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location = /api/game {
            if ($game_cookie_api_upstream = "") {
                return 404;
            }
            rewrite ^/api/game$ / break;
            proxy_pass $game_cookie_api_upstream;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location ^~ /api/game/ {
            if ($game_cookie_api_upstream = "") {
                return 404;
            }
            rewrite ^/api/game/(.*)$ /$1 break;
            proxy_pass $game_cookie_api_upstream;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /api/ {
            proxy_pass http://web_gateway/api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game/_next/static {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/_next/static$ /_next/static break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ^~ /game/_next/static/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/(.*)$ /$1 break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ~ ^/game/[A-Za-z0-9]+/_next/static(?:/|$) {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/[A-Za-z0-9]+/(.*)$ /$1 break;
            proxy_pass $game_path_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location = /game/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location ~ ^/game/[A-Za-z0-9]+(?:/|$) {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_path_web_upstream;
        }
        location /game/ {
            return 404;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/opensamguk.crt;
        ssl_certificate_key /etc/nginx/certs/opensamguk.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /api/admin/ {
            if ($game_cookie_api_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_api_upstream;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location = /api/game {
            if ($game_cookie_api_upstream = "") {
                return 404;
            }
            rewrite ^/api/game$ / break;
            proxy_pass $game_cookie_api_upstream;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location ^~ /api/game/ {
            if ($game_cookie_api_upstream = "") {
                return 404;
            }
            rewrite ^/api/game/(.*)$ /$1 break;
            proxy_pass $game_cookie_api_upstream;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /api/ {
            proxy_pass http://web_gateway/api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game/_next/static {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/_next/static$ /_next/static break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ^~ /game/_next/static/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/(.*)$ /$1 break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ~ ^/game/[A-Za-z0-9]+/_next/static(?:/|$) {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/[A-Za-z0-9]+/(.*)$ /$1 break;
            proxy_pass $game_path_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location = /game/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location ~ ^/game/[A-Za-z0-9]+(?:/|$) {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_path_web_upstream;
        }
        location /game/ {
            return 404;
        }
        location / {
            proxy_pass http://web_gateway/;
        }
    }
}
