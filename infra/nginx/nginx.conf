events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    upstream gateway_api {
        server gateway-api:8080;
        keepalive 32;
    }
    upstream web_gateway {
        server web-gateway:3000;
        keepalive 32;
    }
    upstream web_game {
        server s1-web-game:3001;
        keepalive 32;
    }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /api/ {
            proxy_pass http://web_gateway/api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location /game/_next/static/ {
            proxy_pass http://web_game/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location /game/ {
            proxy_pass http://web_game;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/opensamguk.crt;
        ssl_certificate_key /etc/nginx/certs/opensamguk.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /api/ {
            proxy_pass http://web_gateway/api/;
            limit_req zone=api_limit burst=20 nodelay;
        }
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location /game/_next/static/ {
            proxy_pass http://web_game/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location /game/ {
            proxy_pass http://web_game;
        }
        location / {
            proxy_pass http://web_gateway/;
        }
    }
}
