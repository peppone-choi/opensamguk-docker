events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    upstream gateway_api {
        server gateway-api:8080;
        keepalive 32;
    }
    upstream web_gateway {
        server web-gateway:3000;
        keepalive 32;
    }
    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    map $uri $game_path_web_upstream {
        default "";
        ~^/game/(?:all|admin1|admin2|admin5|admin7|admin8|auction|battle-center|betting|board|chief-center|city|coming-soon|diplomacy|generals|global-diplomacy|history|inherit|join|mailbox|main|map|my|my-boss|my-cities|my-generals|my-nation|nation|nation-betting|nation-finance|npc-control|rankings|register|select-pool|simulator|tournament|tournament-admin|troop|vote|world-log)(?:/|$) "";
        "~^/game/(?<path_public_server_id>[a-z0-9]{1,48})(?:/|$)" http://s${path_public_server_id}-web-game:3001;
    }
    map $cookie_sam_server $game_cookie_web_upstream {
        default "";
        ~^(?:all|admin1|admin2|admin5|admin7|admin8|auction|battle-center|betting|board|chief-center|city|coming-soon|diplomacy|generals|global-diplomacy|history|inherit|join|mailbox|main|map|my|my-boss|my-cities|my-generals|my-nation|nation|nation-betting|nation-finance|npc-control|rankings|register|select-pool|simulator|tournament|tournament-admin|troop|vote|world-log)$ "";
        "~^(?<cookie_web_public_server_id>[a-z0-9]{1,48})$" http://s${cookie_web_public_server_id}-web-game:3001;
    }
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }
        # --- OPENSAM-93: same-origin read-only serving of gateway-api managed profile icons ---
        # The `profile-icons` named volume is mounted read-only into this container (see compose);
        # gateway-api stays the SOLE writer. Only canonical managed filenames ([0-9a-f]{8}.<img-ext>,
        # LocalProfileIconStorage MANAGED_FILE) match this anchored regex, so the `.ops` operation
        # dir, dot/temp/marker files, path traversal, and non-image extensions can never be read.
        # Missing files return 404 — the UI carries a guarded default fallback (portrait.ts).
        location ~ "^/d_pic/(?<profile_icon>[0-9a-f]{8}\.(?:avif|webp|jpg|png|gif))$" {
            alias /var/lib/opensamguk/profile-icons/$profile_icon;
            disable_symlinks on;
            autoindex off;
            add_header X-Content-Type-Options "nosniff" always;
            expires 7d;
            access_log off;
        }
        # Any /d_pic/ path that is NOT a canonical managed filename (dot paths, `.ops`, temp/marker,
        # traversal, nested paths, non-image extensions) gets a clean 404 here instead of falling
        # through to the SPA. The regex location above wins for canonical names; this catches the rest.
        location /d_pic/ {
            return 404;
        }
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
            # 전콘 업로드가 nginx 기본 1MB에 먼저 걸려 생 413 HTML이 나가지 않게 한다.
            # 실제 상한은 gateway-api의 profile-icon.max-bytes(50KB) — canonical 한글 에러가 나가야 한다.
            client_max_body_size 2m;
        }
        location /api/board/ {
            proxy_pass http://web_gateway/api/board/;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_buffering off;
            proxy_cache off;
        }
        location /api/ {
            proxy_pass http://web_gateway/api/;
            limit_req zone=api_limit burst=20 nodelay;
            # 브라우저 업로드는 /api/account/profile-icon(web-gateway Next route handler) 경유다.
            # 여기서도 1MB를 풀어야 앱 상한 검증이 실제로 응답을 만든다.
            client_max_body_size 2m;
        }
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game/_next/static {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/_next/static$ /_next/static break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ^~ /game/_next/static/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/(.*)$ /$1 break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ~ ^/game/(?:admin1|admin2|admin5|admin7|admin8|auction|battle-center|betting|board|chief-center|city|coming-soon|diplomacy|generals|global-diplomacy|history|inherit|join|mailbox|main|map|my|my-boss|my-cities|my-generals|my-nation|nation|nation-betting|nation-finance|npc-control|rankings|register|select-pool|simulator|tournament|tournament-admin|troop|vote|world-log)(?:/|$) {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location ~ "^/game/[a-z0-9]{1,48}/_next/static(?:/|$)" {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            rewrite "^/game/[a-z0-9]{1,48}/(.*)$" /$1 break;
            proxy_pass $game_path_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location = /game/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location ~ "^/game/[a-z0-9]{1,48}(?:/|$)" {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_path_web_upstream;
        }
        location /game/ {
            return 404;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/opensamguk.crt;
        ssl_certificate_key /etc/nginx/certs/opensamguk.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }
        # --- OPENSAM-93: same-origin read-only serving of gateway-api managed profile icons ---
        # The `profile-icons` named volume is mounted read-only into this container (see compose);
        # gateway-api stays the SOLE writer. Only canonical managed filenames ([0-9a-f]{8}.<img-ext>,
        # LocalProfileIconStorage MANAGED_FILE) match this anchored regex, so the `.ops` operation
        # dir, dot/temp/marker files, path traversal, and non-image extensions can never be read.
        # Missing files return 404 — the UI carries a guarded default fallback (portrait.ts).
        location ~ "^/d_pic/(?<profile_icon>[0-9a-f]{8}\.(?:avif|webp|jpg|png|gif))$" {
            alias /var/lib/opensamguk/profile-icons/$profile_icon;
            disable_symlinks on;
            autoindex off;
            add_header X-Content-Type-Options "nosniff" always;
            expires 7d;
            access_log off;
        }
        # Any /d_pic/ path that is NOT a canonical managed filename (dot paths, `.ops`, temp/marker,
        # traversal, nested paths, non-image extensions) gets a clean 404 here instead of falling
        # through to the SPA. The regex location above wins for canonical names; this catches the rest.
        location /d_pic/ {
            return 404;
        }
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
            # 전콘 업로드가 nginx 기본 1MB에 먼저 걸려 생 413 HTML이 나가지 않게 한다.
            # 실제 상한은 gateway-api의 profile-icon.max-bytes(50KB) — canonical 한글 에러가 나가야 한다.
            client_max_body_size 2m;
        }
        location /api/board/ {
            proxy_pass http://web_gateway/api/board/;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_buffering off;
            proxy_cache off;
        }
        location /api/ {
            proxy_pass http://web_gateway/api/;
            limit_req zone=api_limit burst=20 nodelay;
            # 브라우저 업로드는 /api/account/profile-icon(web-gateway Next route handler) 경유다.
            # 여기서도 1MB를 풀어야 앱 상한 검증이 실제로 응답을 만든다.
            client_max_body_size 2m;
        }
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game/_next/static {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/_next/static$ /_next/static break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ^~ /game/_next/static/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            rewrite ^/game/(.*)$ /$1 break;
            proxy_pass $game_cookie_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location ~ ^/game/(?:admin1|admin2|admin5|admin7|admin8|auction|battle-center|betting|board|chief-center|city|coming-soon|diplomacy|generals|global-diplomacy|history|inherit|join|mailbox|main|map|my|my-boss|my-cities|my-generals|my-nation|nation|nation-betting|nation-finance|npc-control|rankings|register|select-pool|simulator|tournament|tournament-admin|troop|vote|world-log)(?:/|$) {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location ~ "^/game/[a-z0-9]{1,48}/_next/static(?:/|$)" {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            rewrite "^/game/[a-z0-9]{1,48}/(.*)$" /$1 break;
            proxy_pass $game_path_web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /game {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location = /game/ {
            if ($game_cookie_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_cookie_web_upstream;
        }
        location ~ "^/game/[a-z0-9]{1,48}(?:/|$)" {
            if ($game_path_web_upstream = "") {
                return 404;
            }
            proxy_pass $game_path_web_upstream;
        }
        location /game/ {
            return 404;
        }
        location / {
            proxy_pass http://web_gateway/;
        }
    }
}
