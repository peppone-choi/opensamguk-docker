# Production nginx reverse proxy for opensamguk
# Mounted at /etc/nginx/nginx.conf in the nginx container

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstreams
    upstream gateway_api {
        server gateway-api:8080;
        keepalive 32;
    }

    upstream game_api {
        server game-api:8081;
        keepalive 32;
    }

    upstream game_engine {
        server game-engine:8082;
        keepalive 16;
    }

    upstream web_gateway {
        server web-gateway:3000;
        keepalive 32;
    }

    upstream web_game {
        server web-game:3001;
        keepalive 32;
    }

    # Proxy defaults
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=command_limit:10m rate=30r/m;

    server {
        listen 80;
        server_name _;

        # Health check (bypasses most filters)
        location /health {
            access_log off;
            return 200 '{"status":"up","nginx":"ok"}';
            add_header Content-Type application/json;
        }

        # --- API: gateway (auth, profile) ---
        location /api/gateway/ {
            proxy_pass http://gateway_api/;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # --- API: game (read, precheck, intake) ---
        location /api/game/ {
            proxy_pass http://game_api/;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # --- SSE: realtime events (long-polling, no buffering) ---
        location /api/game/realtime/ {
            proxy_pass http://game_api/realtime/;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- API: game-engine internal (not exposed externally in prod) ---
        # Uncomment only if engine needs external reachability:
        # location /api/engine/ {
        #     proxy_pass http://game_engine/;
        #     allow 10.0.0.0/8;
        #     deny all;
        # }

        # --- Game client SPA ---
        location /game/ {
            proxy_pass http://web_game/;
        }

        # --- Gateway / landing SPA (default) ---
        location / {
            proxy_pass http://web_gateway/;
        }

        # --- Static assets (Next.js static) ---
        location /_next/static/ {
            proxy_pass http://web_gateway/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /game/_next/static/ {
            proxy_pass http://web_game/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
