# 공유 스택 — 전 게임 서버 공통(로그인/로비/어드민/배포)
# 프로젝트명: opensamguk-shared
# 기동: docker compose -p opensamguk-shared -f docker-compose.shared.yml --env-file .env up -d
#
# 멀티서버 구조에서 "공유"되는 것:
#   - 유저/인증 DB(gateway-postgres) — 계정은 서버에 종속되지 않음
#   - 게이트웨이 API + 게시판 API + 게이트웨이 웹(로비/어드민)
#   - nginx(게이트웨이 진입점, /)
#   - deployer 사이드카(서버별 버전 bounce 배포)
#   - socket-proxy(deployer에만 제한된 docker API 노출)
# 게임 월드(엔진/게임DB/게임API/게임웹)는 docker-compose.server.yml로 서버마다 따로 띄운다.
name: opensamguk-shared

services:
  # 유저/인증 전용 DB. 게임 월드 DB(서버별 game-postgres)와 분리된 단일 공유 DB.
  gateway-postgres:
    image: postgres:16-alpine
    container_name: opensamguk-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GATEWAY_POSTGRES_DB:-sammo_gateway}
      POSTGRES_USER: ${GATEWAY_POSTGRES_USER:-sammo}
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?GATEWAY_POSTGRES_PASSWORD required}
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GATEWAY_POSTGRES_USER:-sammo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 512M

  gateway-redis:
    image: redis:7-alpine
    container_name: opensamguk-gateway-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - gateway-redisdata:/data
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 150M

  gateway-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-peppone-choi}/opensamguk:gateway-api-${IMAGE_TAG:-latest}
    container_name: opensamguk-gateway-api
    restart: unless-stopped
    environment:
      # 인증/유저 DB는 gateway-postgres(공유). 게임 월드 DB는 참조하지 않는다.
      GAME_DATABASE_URL: jdbc:postgresql://gateway-postgres:5432/${GATEWAY_POSTGRES_DB:-sammo_gateway}
      GAME_DB_USER: ${GATEWAY_POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?GATEWAY_POSTGRES_PASSWORD required}
      # JWT — gateway-api만 개인키를 갖고 토큰을 발급한다(RS256). board-api와 서버별 game-api는
      # 공개키만 받아 검증만 한다(JWT_PUBLIC_KEY, 아래 board-api 참고).
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_SIGNING_MODE: ${JWT_SIGNING_MODE:-RS256}
      JWT_INCLUDE_PROFILE_CLAIMS: ${JWT_INCLUDE_PROFILE_CLAIMS:-true}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_LEGACY_ACCESS_ACCEPT_UNTIL: ${JWT_LEGACY_ACCESS_ACCEPT_UNTIL:-}
      JWT_LEGACY_REFRESH_ACCEPT_UNTIL: ${JWT_LEGACY_REFRESH_ACCEPT_UNTIL:-}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # 관리자 시드(빈 users 테이블에서 1회 멱등 생성).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-peppone}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      REDIS_HOST: gateway-redis
      REDIS_PORT: 6379
      # OPENSAM-93: 업로드된 전콘 영속 경로. nginx가 같은 볼륨을 read-only로 읽어 /d_pic/로 서빙한다.
      PROFILE_ICON_STORAGE_ROOT: /var/lib/opensamguk/profile-icons
      # --- 멀티서버 fan-out / 버전 배포 ---
      # 게임 서버 레지스트리(JSON 배열). 로비·어드민이 각 서버 game-api/엔진을 알기 위한 표.
      # 예: [{"id":"pep","name":"통일 서버","generation":1,"gameApiUrl":"http://spep-game-api:8081",
      #       "gameEngineUrl":"http://spep-game-engine:8082","deployProject":"opensamguk-spep"}]
      # 어드민 버전 패널 → deployer 사이드카(내부망 + 토큰)로 bounce 배포 위임.
      SERVER_REGISTRY_JSON: ${SERVER_REGISTRY_JSON:-[]}
      DEPLOYER_URL: ${DEPLOYER_URL:-http://deployer:9000}
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:?DEPLOYER_TOKEN required}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      gateway-postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      # OPENSAM-93: 전콘 저장소. gateway-api가 유일한 writer(쓰기 마운트).
      - profile-icons:/var/lib/opensamguk/profile-icons
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 512M

  board-api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-peppone-choi}/opensamguk:board-api-${IMAGE_TAG:-latest}
    container_name: opensamguk-board-api
    restart: unless-stopped
    environment:
      GAME_DATABASE_URL: jdbc:postgresql://gateway-postgres:5432/${GATEWAY_POSTGRES_DB:-sammo_gateway}
      GAME_DB_USER: ${GATEWAY_POSTGRES_USER:-sammo}
      GAME_DB_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:?GATEWAY_POSTGRES_PASSWORD required}
      # JWT — board-api는 gateway-api가 발급한 토큰을 공개키로만 검증한다(개인키 없음).
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_LEGACY_ACCESS_ACCEPT_UNTIL: ${JWT_LEGACY_ACCESS_ACCEPT_UNTIL:-}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=40.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      gateway-postgres:
        condition: service_healthy
      # board-api never calls gateway-api at runtime (it only reads/writes gateway_board_post /
      # gateway_board_comment on the shared DB). This stays service_healthy anyway to preserve
      # first-boot migration ordering on an empty DB — gateway-api's Flyway migration must run
      # before board-api's JPA validates the schema.
      gateway-api:
        condition: service_healthy
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 512M

  web-gateway:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-peppone-choi}/opensamguk:web-gateway-${IMAGE_TAG:-latest}
    container_name: opensamguk-web-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # 서버 전용 프록시 타깃(NEXT_PUBLIC_GAME_URL은 빌드타임에 이미지에 인라인됨).
      GATEWAY_API_URL: ${GATEWAY_API_URL:-http://gateway-api:8080}
      BOARD_API_URL: ${BOARD_API_URL:-http://board-api:8083}
      SERVER_REGISTRY_JSON: ${SERVER_REGISTRY_JSON:-[]}
    depends_on:
      gateway-api:
        condition: service_healthy
      # service_started, not service_healthy: 이전 IMAGE_TAG(board-api 이미지 없음)로 롤백하면
      # board-api가 영구히 unhealthy가 되어 web-gateway까지 못 뜨고 로그인/로비 전체가 502가 된다.
      # 게시판만 죽고 스택은 살아야 한다.
      board-api:
        condition: service_started
    expose:
      - "3000"
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: opensamguk-nginx
    restart: unless-stopped
    volumes:
      - ${COMPOSE_HOST_DIR:-${PWD:-.}}/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # OPENSAM-93: same-origin /d_pic/ read-only serving of gateway-api managed profile icons.
      # SAME named volume gateway-api writes to, mounted READ-ONLY here — gateway-api stays the sole
      # writer. Path matches nginx.conf's `location /d_pic/` alias root.
      - profile-icons:/var/lib/opensamguk/profile-icons:ro
      - nginx-cache:/var/cache/nginx
      - ${COMPOSE_HOST_DIR:-${PWD:-.}}/infra/nginx/certs:/etc/nginx/certs:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway-api
      - board-api
      - web-gateway
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 128M

  # 배포 사이드카 — 어드민/게이트웨이가 토큰으로 호출하면 서버별 IMAGE_TAG를 바꾸고
  # 스테이트리스 서비스(game-api, web-game)만 bounce. game-engine은 절대 건드리지 않는다.
  # 외부 포트 노출 없음(expose만) — 내부망에서 gateway-api만 도달.
  deployer:
    build:
      context: ./deployer
    image: opensamguk-deployer:local
    container_name: opensamguk-deployer
    restart: unless-stopped
    environment:
      # 배포 호출 인증 토큰(gateway-api와 동일 값).
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:?DEPLOYER_TOKEN required}
      # docker.sock 직접 접근 금지 — socket-proxy 경유(least-privilege).
      DOCKER_HOST: tcp://socket-proxy:2375
      # 컨테이너 안에서 compose/서버 env 파일이 마운트된 경로.
      COMPOSE_DIR: /workspace
      SERVERS_DIR: /workspace/servers
      COMPOSE_SERVER_FILE: /workspace/docker-compose.server.yml
      COMPOSE_SHARED_FILE: /workspace/docker-compose.shared.yml
      DEPLOYER_MAINTENANCE_FILE: /workspace/servers/.deployer-maintenance
      DEPLOYER_LIFECYCLE_JOURNAL_FILE: /workspace/servers/.deployer-lifecycle-journal
      DEPLOYER_OPERATION_FILE: /workspace/servers/.deployer-operations.json
      COMPOSE_HOST_DIR: ${COMPOSE_HOST_DIR:-${PWD:-.}}
      # GHCR 태그 조회용(공개 패키지면 익명, private면 토큰 필요 — 미해결 가정 참고).
      GHCR_OWNER: ${GHCR_OWNER:-peppone-choi}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # compose 파일 + 서버 env 파일을 read-write로 마운트(IMAGE_TAG 갱신 + compose 실행).
      - ./:/workspace:rw
    expose:
      - "9000"
    depends_on:
      - socket-proxy
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 128M

  # docker.sock 프록시 — deployer에게 compose up에 필요한 최소 docker API만 노출.
  # docker.sock은 read-only로 마운트. 외부 노출 없음.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: opensamguk-socket-proxy
    restart: unless-stopped
    environment:
      # 허용(1) — compose pull/up(재생성)에 필요한 섹션만. 나머지는 기본 거부(0).
      # 게이팅 규칙(tecnativa haproxy): `deny unless METH_GET || POST` → POST=1이면 GET 외
      # 모든 메서드(POST/DELETE 포함)가 통과하고, 그다음 섹션별 path allow가 결정한다.
      CONTAINERS: 1   # 컨테이너 생성/시작/정지/삭제/조회 — compose up 재생성에 DELETE까지 필요.
      SERVICES: 1
      IMAGES: 1       # 이미지 pull(POST /images/create).
      NETWORKS: 1     # 외부망 opensamguk-net 조회.
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      # POST=1 = GET 외 쓰기 메서드 전면 허용(이게 없으면 pull/up 불가). 실질 제한은 아래 섹션 거부 +
      # deployer 바이너리(스테이트리스 game-api/web-game만 compose up)가 담당한다.
      POST: 1
      # 명시적 거부(기본값이지만 의도 고정) — 원격 코드실행/호스트/스왐/시크릿 계열은 차단.
      # (주의: 'CONTAINERS_DELETE' 같은 변수는 없다 — 컨테이너 삭제는 CONTAINERS+POST로 가는 게 정상이며
      #  재생성에 필수다. 엔진 보호는 socket-proxy가 아니라 deployer 코드의 서비스 화이트리스트가 한다.)
      EXEC: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      BUILD: 0
      COMMIT: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - opensamguk-net
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  gateway-pgdata:
    driver: local

  gateway-redisdata:
    driver: local
  profile-icons:
    driver: local
  nginx-cache:
    driver: local

networks:
  # 공유 스택과 모든 서버 스택이 공통으로 join하는 외부 네트워크.
  # 최초 1회: docker network create opensamguk-net
  opensamguk-net:
    external: true
