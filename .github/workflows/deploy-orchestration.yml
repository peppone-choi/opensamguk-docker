name: Deploy Orchestration to GCP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-orchestration.yml"
      - "deployer/**"
      - "docker-compose.shared.yml"
      - "docker-compose.server.yml"
      - "infra/nginx/**"
  workflow_dispatch:

concurrency:
  group: deploy-orchestration-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gcp-prod]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Synchronize, validate, replace, and verify orchestration
        run: |
          set -euo pipefail
          WORKFLOW_DEADLINE=$((SECONDS + 2400))
          deadline_remaining() {
            local deadline="$1"
            local remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              return 1
            fi
            printf '%s\n' "$remaining"
          }
          bounded_sleep() {
            local deadline="$1"
            local requested="$2"
            local remaining
            if ! remaining="$(deadline_remaining "$deadline")"; then
              return 1
            fi
            if (( requested > remaining )); then
              requested="$remaining"
            fi
            timeout --foreground -k 2 "$requested" sleep "$requested"
          }
          run_bounded() {
            local deadline="$1"
            local requested="$2"
            shift 2
            local remaining
            if ! remaining="$(deadline_remaining "$deadline")"; then
              return 124
            fi
            if (( requested > remaining )); then
              requested="$remaining"
            fi
            timeout --foreground -k 2 "$requested" "$@"
          }
          docker_exec_bounded() {
            local deadline="$1"
            local requested="$2"
            shift 2
            run_bounded "$deadline" "$requested" sudo docker exec "$@"
          }
          exec 9>/tmp/opensamguk-production.lock
          if ! run_bounded "$WORKFLOW_DEADLINE" 1800 flock -w 1800 9; then
            echo "::error::Timed out acquiring /tmp/opensamguk-production.lock after 1800 seconds"
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          maintenance_response_state() {
            printf '%s' "$1" | run_bounded "$WORKFLOW_DEADLINE" 10 python3 -c 'import json, re, sys; payload = json.load(sys.stdin); keys = set(payload) if isinstance(payload, dict) else set(); valid = keys in ({"capability", "state"}, {"capability", "state", "lease"}) and payload.get("capability") == "maintenance-v1" and payload.get("state") in {"open", "draining", "drained"} and ("lease" not in payload or re.fullmatch(r"[a-f0-9]{32}", payload["lease"]) is not None); valid or sys.exit(1); print(payload["state"])'
          }
          maintenance_get() {
            docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c '
              timeout -k 2 10 wget -qO- -T 5 --header="Authorization: Bearer $DEPLOYER_TOKEN" http://localhost:9000/maintenance
            ' 2>/dev/null
          }
          maintenance_post() {
            docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c '
              timeout -k 2 10 wget -qO- -T 5 --header="Authorization: Bearer $DEPLOYER_TOKEN" --post-data="" "http://localhost:9000$1"
            ' maintenance "$1" 2>/dev/null
          }
          DEPLOYER_FRESH=false
          if run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps -a --format '{{.Names}}' | grep -Fxq opensamguk-deployer; then
            if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_get)")"; then
              echo "::error::running deployer lacks a valid maintenance-v1 capability; aborting before control-plane mutation"
              exit 1
            fi
            if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_post /maintenance/enter)")" || [ "$MAINTENANCE_STATE" != drained ]; then
              echo "::error::deployer maintenance drain did not reach drained; aborting before control-plane mutation"
              exit 1
            fi
          else
            run_bounded "$WORKFLOW_DEADLINE" 30 mkdir -p "$STACK/servers"
            : > "$STACK/servers/.deployer-maintenance"
            DEPLOYER_FRESH=true
          fi

          run_bounded "$WORKFLOW_DEADLINE" 180 git fetch --prune origin main
          if ! run_bounded "$WORKFLOW_DEADLINE" 30 git diff --quiet || ! run_bounded "$WORKFLOW_DEADLINE" 30 git diff --cached --quiet; then
            echo "::error::opensamguk-docker has local tracked changes; refusing to overwrite prod orchestration files"
            run_bounded "$WORKFLOW_DEADLINE" 30 git status --short
            exit 1
          fi
          run_bounded "$WORKFLOW_DEADLINE" 180 git merge --ff-only origin/main

          COMPOSE="sudo docker compose -p opensamguk-shared -f docker-compose.shared.yml --env-file .env"
          run_bounded "$WORKFLOW_DEADLINE" 900 $COMPOSE build deployer
          run_bounded "$WORKFLOW_DEADLINE" 120 sudo docker run --rm --read-only --network none \
            -e COMPOSE_DIR=/workspace \
            -v "$STACK/.env:/workspace/.env:ro" \
            -v "$STACK/servers:/workspace/servers:ro" \
            opensamguk-deployer:local --check-registry

          run_bounded "$WORKFLOW_DEADLINE" 300 $COMPOSE up -d --force-recreate --no-deps deployer
          deployer_ready=false
          for _ in $(seq 1 30); do
            if ! deadline_remaining "$WORKFLOW_DEADLINE" >/dev/null; then
              break
            fi
            if docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c 'timeout -k 2 10 wget -qO- -T 5 http://localhost:9000/healthz' | grep -q '"status":"up"' && \
              docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c 'timeout -k 2 10 wget -qO- -T 5 http://localhost:9000/readyz' | grep -q '"status":"ready"'; then
              deployer_ready=true
              break
            fi
            if ! bounded_sleep "$WORKFLOW_DEADLINE" 2; then
              break
            fi
          done
          if [ "$deployer_ready" != true ]; then
            echo "::error::deployer did not become healthz+readyz ready before nginx reload"
            exit 1
          fi
          if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_get)")" || [ "$MAINTENANCE_STATE" != drained ]; then
            echo "::error::recreated deployer did not boot with the persisted maintenance barrier drained"
            exit 1
          fi

          run_bounded "$WORKFLOW_DEADLINE" 300 $COMPOSE up -d --force-recreate --no-deps nginx
          docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c 'timeout -k 2 10 wget -qO- -T 5 http://localhost:9000/healthz' | grep -q '"status":"up"'
          docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c 'timeout -k 2 10 wget -qO- -T 5 http://localhost:9000/readyz' | grep -q '"status":"ready"'
          run_bounded "$WORKFLOW_DEADLINE" 15 curl -fsS --max-time 10 http://localhost/health | grep -q '"status":"up"'

          SERVER_IDS="$(run_bounded "$WORKFLOW_DEADLINE" 15 python3 - "$STACK/.env" <<'PY'
          import json
          import re
          import sys

          registry = []
          for line in open(sys.argv[1], encoding="utf-8"):
              if line.startswith("SERVER_REGISTRY_JSON="):
                  try:
                      registry = json.loads(line.split("=", 1)[1])
                  except json.JSONDecodeError:
                      registry = []
                  break

          for entry in registry if isinstance(registry, list) else []:
              server_id = entry.get("id") if isinstance(entry, dict) else None
              if isinstance(server_id, str) and server_id != "all" and re.fullmatch(r"[a-z0-9]+", server_id):
                  print(server_id)
          PY
          )"
          if [ -n "$SERVER_IDS" ]; then
            route_checked=false
            for SERVER_ID in $SERVER_IDS; do
              INTERNAL_ID="s${SERVER_ID}"
              if run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps --format '{{.Names}}' | grep -Fxq "${INTERNAL_ID}-web-game"; then
                run_bounded "$WORKFLOW_DEADLINE" 15 curl -fsS --max-time 10 "http://localhost/game/${SERVER_ID}" >/dev/null
                route_checked=true
                break
              fi
            done
            if [ "$route_checked" != true ]; then
              echo "no running registered server; game route check skipped"
            fi
          else
            echo "no valid registered server; game route check skipped"
          fi

          if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_post /maintenance/leave)")" || [ "$MAINTENANCE_STATE" != open ]; then
            echo "::error::deployer maintenance barrier did not reopen after successful orchestration verification"
            exit 1
          fi
