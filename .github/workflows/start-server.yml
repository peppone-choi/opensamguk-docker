name: Start Existing Game Server

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Server id, e.g. s1"
        required: true
        default: "s1"

concurrency:
  group: start-game-server-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: [self-hosted, ec2-prod]
    permissions:
      contents: read
    steps:
      - name: Sync orchestration repo on box
        run: |
          set -euo pipefail
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          git fetch --prune origin main
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::opensamguk-docker has local tracked changes; refusing to overwrite prod orchestration files"
            git status --short
            exit 1
          fi
          git merge --ff-only origin/main

      - name: Start existing server stack
        env:
          SERVER_ID: ${{ inputs.server_id }}
        run: |
          set -euo pipefail
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          NUM="${SERVER_ID#s}"
          ENV_FILE="servers/s${NUM}.env"
          PROJECT="opensamguk-s${NUM}"
          test -f "$ENV_FILE"

          sudo docker compose -p "$PROJECT" \
            --env-file "$ENV_FILE" \
            -f docker-compose.server.yml \
            up -d

          sudo docker compose -p opensamguk-shared \
            -f docker-compose.shared.yml \
            --env-file .env \
            up -d --force-recreate --no-deps nginx

      - name: Wait for server and route
        env:
          SERVER_ID: ${{ inputs.server_id }}
        run: |
          set -euo pipefail
          NUM="${SERVER_ID#s}"
          for i in $(seq 1 90); do
            if sudo docker ps --format '{{.Names}}' | grep -q "^s${NUM}-game-api$" &&
               sudo docker ps --format '{{.Names}}' | grep -q "^s${NUM}-game-engine$" &&
               sudo docker ps --format '{{.Names}}' | grep -q "^s${NUM}-web-game$" &&
               curl -fsS http://localhost/health | grep -q '"status":"up"' &&
               curl -fsS "http://localhost/game/s${NUM}" >/dev/null; then
              echo "server s${NUM} is ready"
              exit 0
            fi
            sleep 5
          done

          echo "::error::server ${SERVER_ID} did not become ready"
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          exit 1
