name: Start Existing Game Server

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Public server id (mixed case accepted, stored lowercase), e.g. pep"
        required: true
        default: "pep"
      image_tag:
        description: "Optional existing image tag to write into server env before start"
        required: false
        default: ""

concurrency:
  group: start-game-server-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  start:
    runs-on: [self-hosted, gcp-prod]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Synchronize, start, and verify server lifecycle
        env:
          SERVER_ID: ${{ inputs.server_id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          WORKFLOW_DEADLINE=$((SECONDS + 2400))
          deadline_remaining() {
            local deadline="$1"
            local remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              return 1
            fi
            printf '%s\n' "$remaining"
          }
          bounded_sleep() {
            local deadline="$1"
            local requested="$2"
            local remaining
            if ! remaining="$(deadline_remaining "$deadline")"; then
              return 1
            fi
            if (( requested > remaining )); then
              requested="$remaining"
            fi
            local timeout_seconds=$((requested + 1))
            if (( timeout_seconds > remaining )); then
              timeout_seconds="$remaining"
            fi
            timeout --foreground -k 2 "$timeout_seconds" sleep "$requested"
          }
          run_bounded() {
            local deadline="$1"
            local requested="$2"
            shift 2
            local remaining
            if ! remaining="$(deadline_remaining "$deadline")"; then
              return 124
            fi
            if (( requested > remaining )); then
              requested="$remaining"
            fi
            timeout --foreground -k 2 "$requested" "$@"
          }
          docker_exec_bounded() {
            local deadline="$1"
            local requested="$2"
            shift 2
            run_bounded "$deadline" "$requested" sudo docker exec "$@"
          }
          exec 9>/tmp/opensamguk-production.lock
          if ! run_bounded "$WORKFLOW_DEADLINE" 1800 flock -w 1800 9; then
            echo "::error::Timed out acquiring /tmp/opensamguk-production.lock after 1800 seconds"
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          validate_start_input() {
            RAW_SERVER_ID="$SERVER_ID"
            if [[ ! "$RAW_SERVER_ID" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::invalid server_id; use non-empty ASCII alphanumeric public id"
              exit 1
            fi
            PUBLIC_ID="$(printf '%s' "$RAW_SERVER_ID" | tr '[:upper:]' '[:lower:]')"
            if (( ${#PUBLIC_ID} > 48 )); then
              echo "::error::server_id must be at most 48 ASCII alphanumeric characters"
              exit 1
            fi
            case "$PUBLIC_ID" in
              all|admin1|admin2|admin5|admin7|admin8|auction|battle-center|betting|board|chief-center|city|coming-soon|diplomacy|generals|global-diplomacy|history|inherit|join|mailbox|main|map|my|my-boss|my-cities|my-generals|my-nation|nation|nation-betting|nation-finance|npc-control|rankings|register|select-pool|simulator|tournament|tournament-admin|troop|vote|world-log)
                echo "::error::server_id ${PUBLIC_ID} is reserved for a game route or all-server operation"
                exit 1
                ;;
            esac
            INTERNAL_ID="s${PUBLIC_ID}"
            ENV_FILE="servers/${INTERNAL_ID}.env"
            PROJECT="opensamguk-${INTERNAL_ID}"
            test -f "$ENV_FILE"
            ENV_SERVER_ID="$(run_bounded "$WORKFLOW_DEADLINE" 15 sudo awk -F= '$1 == "SERVER_ID" && NF == 2 { print $2 }' "$ENV_FILE")"
            if [[ "$ENV_SERVER_ID" != "$PUBLIC_ID" ]]; then
              echo "::error::SERVER_ID in $ENV_FILE must exactly match canonical public id $PUBLIC_ID"
              exit 1
            fi
            if [ -n "$IMAGE_TAG" ] && [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::invalid image_tag"
              exit 1
            fi
          }
          validate_start_input

          maintenance_response_state() {
            printf '%s' "$1" | run_bounded "$WORKFLOW_DEADLINE" 10 python3 -c 'import json, re, sys; payload = json.load(sys.stdin); keys = set(payload) if isinstance(payload, dict) else set(); valid = keys in ({"capability", "state"}, {"capability", "state", "lease"}) and payload.get("capability") == "maintenance-v1" and payload.get("state") in {"open", "draining", "drained"} and ("lease" not in payload or re.fullmatch(r"[a-f0-9]{32}", payload["lease"]) is not None); valid or sys.exit(1); print(payload["state"])'
          }
          maintenance_get() {
            docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer /usr/local/bin/deployer --authenticated-http GET /maintenance 2>/dev/null
          }
          maintenance_post() {
            docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer /usr/local/bin/deployer --authenticated-http POST "$1" 2>/dev/null
          }
          authenticated_http_supports_timeout() {
            local usage
            usage="$(docker_exec_bounded "$WORKFLOW_DEADLINE" 5 opensamguk-deployer /usr/local/bin/deployer --help 2>&1 || true)"
            printf '%s' "$usage" | run_bounded "$WORKFLOW_DEADLINE" 5 grep -q 'TIMEOUT_SECONDS'
          }
          maintenance_repair() {
            if authenticated_http_supports_timeout; then
              docker_exec_bounded "$WORKFLOW_DEADLINE" 300 opensamguk-deployer /usr/local/bin/deployer --authenticated-http POST /maintenance/repair 285
              return
            fi
            docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer /usr/local/bin/deployer --authenticated-http POST /maintenance/repair >/dev/null 2>&1 || true
            wait_for_lifecycle_repair && maintenance_get
          }
          dump_lifecycle_recovery_diagnostics() {
            echo "::group::deployer lifecycle recovery diagnostics"
            run_bounded "$WORKFLOW_DEADLINE" 20 sudo docker logs --tail 200 opensamguk-deployer 2>&1 || true
            local RECOVERY_INTERNAL_ID
            RECOVERY_INTERNAL_ID="$(run_bounded "$WORKFLOW_DEADLINE" 10 python3 - "$STACK/servers/.deployer-lifecycle-journal" <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)
          server_id = payload.get("serverId") if isinstance(payload, dict) else None
          if not isinstance(server_id, str) or re.fullmatch(r"[a-z0-9]{1,48}", server_id) is None:
              raise SystemExit(1)
          print("s" + server_id)
          PY
            )" || RECOVERY_INTERNAL_ID=""
            if [ -n "$RECOVERY_INTERNAL_ID" ]; then
              run_bounded "$WORKFLOW_DEADLINE" 20 sudo docker ps -a --filter "name=${RECOVERY_INTERNAL_ID}-game-engine" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>&1 || true
              run_bounded "$WORKFLOW_DEADLINE" 20 sudo docker logs --tail 200 "${RECOVERY_INTERNAL_ID}-game-engine" 2>&1 || true
            fi
            echo "::endgroup::"
          }
          deployer_http_ready() {
            if ! docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c 'timeout -k 2 10 wget -qO- -T 5 http://localhost:9000/healthz' | grep -q '"status":"up"'; then
              return 1
            fi
            docker_exec_bounded "$WORKFLOW_DEADLINE" 15 opensamguk-deployer sh -c 'timeout -k 2 10 wget -qO- -T 5 http://localhost:9000/readyz' | grep -q '"status":"ready"'
          }
          wait_for_deployer_ready() {
            local attempt
            for ((attempt=1; attempt<=30; attempt++)); do
              if ! deadline_remaining "$WORKFLOW_DEADLINE" >/dev/null; then
                break
              fi
              if deployer_http_ready; then
                return 0
              fi
              if ! bounded_sleep "$WORKFLOW_DEADLINE" 2; then
                break
              fi
            done
            return 1
          }
          wait_for_lifecycle_repair() {
            local attempt
            for ((attempt=1; attempt<=150; attempt++)); do
              if ! deadline_remaining "$WORKFLOW_DEADLINE" >/dev/null; then
                break
              fi
              if deployer_http_ready; then
                return 0
              fi
              if ! bounded_sleep "$WORKFLOW_DEADLINE" 2; then
                break
              fi
            done
            return 1
          }
          ensure_lifecycle_recovery() {
            if wait_for_deployer_ready; then
              return 0
            fi
            if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_repair)")" || [ "$MAINTENANCE_STATE" != drained ]; then
              dump_lifecycle_recovery_diagnostics
              echo "::error::deployer lifecycle recovery cannot be verified; leaving maintenance marker closed"
              return 1
            fi
            if ! wait_for_deployer_ready; then
              dump_lifecycle_recovery_diagnostics
              echo "::error::deployer lifecycle recovery cannot be verified; leaving maintenance marker closed"
              return 1
            fi
          }
          DEPLOYER_BOOTSTRAP=false
          if ! DEPLOYER_RUNNING="$(run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps --format '{{.Names}}')"; then
            echo "::error::could not inspect running deployer state; leaving maintenance unchanged"
            exit 1
          fi
          if ! DEPLOYER_ALL="$(run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps -a --format '{{.Names}}')"; then
            echo "::error::could not inspect deployer container state; leaving maintenance unchanged"
            exit 1
          fi
          if printf '%s\n' "$DEPLOYER_RUNNING" | run_bounded "$WORKFLOW_DEADLINE" 5 grep -Fxq opensamguk-deployer; then
            if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_get)")"; then
              echo "::error::running deployer lacks a valid maintenance-v1 capability; aborting before control-plane mutation"
              exit 1
            fi
            if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_post /maintenance/enter)")" || [ "$MAINTENANCE_STATE" != drained ]; then
              echo "::error::deployer maintenance drain did not reach drained; aborting before control-plane mutation"
              exit 1
            fi
          elif printf '%s\n' "$DEPLOYER_ALL" | run_bounded "$WORKFLOW_DEADLINE" 5 grep -Fxq opensamguk-deployer; then
            echo "stopped deployer found; persisting maintenance marker before bootstrap"
            run_bounded "$WORKFLOW_DEADLINE" 30 mkdir -p "$STACK/servers"
            : > "$STACK/servers/.deployer-maintenance"
            DEPLOYER_BOOTSTRAP=true
          else
            echo "no deployer found; persisting maintenance marker before bootstrap"
            run_bounded "$WORKFLOW_DEADLINE" 30 mkdir -p "$STACK/servers"
            : > "$STACK/servers/.deployer-maintenance"
            DEPLOYER_BOOTSTRAP=true
          fi

          run_bounded "$WORKFLOW_DEADLINE" 180 git fetch --prune origin main
          if ! run_bounded "$WORKFLOW_DEADLINE" 30 git diff --quiet || ! run_bounded "$WORKFLOW_DEADLINE" 30 git diff --cached --quiet; then
            echo "::error::opensamguk-docker has local tracked changes; refusing to overwrite prod orchestration files"
            run_bounded "$WORKFLOW_DEADLINE" 30 git status --short
            exit 1
          fi
          run_bounded "$WORKFLOW_DEADLINE" 180 git merge --ff-only origin/main

          DEPLOYER_COMPOSE=(sudo docker compose -p opensamguk-shared -f docker-compose.shared.yml --env-file .env)
          # deployer는 docker.sock에 직접 붙지 않고 socket-proxy 경유로만 Docker에 접근한다
          # (docker-compose.shared.yml: DOCKER_HOST=tcp://socket-proxy:2375 + depends_on).
          # deployer 재생성은 --no-deps라 의존 서비스를 띄우지 않고, deployer가 이미 떠 있는
          # 경로(DEPLOYER_BOOTSTRAP=false)는 아무것도 재생성하지 않는다. deployer는 살아 있고
          # socket-proxy만 죽어 있는 상태가 정확히 2026-08-04 장애였으므로 부트스트랩 여부와
          # 무관하게 보장한다. 누락되면 deployer의 모든 docker compose 호출이 exit 1로 죽고,
          # 서버 리셋이 down 단계에서 실패해 repair-required로 잠긴다.
          if ! run_bounded "$WORKFLOW_DEADLINE" 300 "${DEPLOYER_COMPOSE[@]}" up -d socket-proxy; then
            echo "::error::could not ensure the deployer socket-proxy; leaving maintenance marker closed"
            exit 1
          fi

          if [ "$DEPLOYER_BOOTSTRAP" = true ]; then
            run_bounded "$WORKFLOW_DEADLINE" 900 "${DEPLOYER_COMPOSE[@]}" build deployer
            run_bounded "$WORKFLOW_DEADLINE" 300 "${DEPLOYER_COMPOSE[@]}" up -d --force-recreate --no-deps deployer
            deployer_closed=false
            for _ in $(seq 1 30); do
              if ! deadline_remaining "$WORKFLOW_DEADLINE" >/dev/null; then
                break
              fi
              if MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_get)")" && [ "$MAINTENANCE_STATE" = drained ]; then
                deployer_closed=true
                break
              fi
              if ! bounded_sleep "$WORKFLOW_DEADLINE" 2; then
                break
              fi
            done
            if [ "$deployer_closed" != true ]; then
              echo "::error::fresh deployer did not boot closed with maintenance-v1"
              exit 1
            fi
          fi

          # socket-proxy 컨테이너의 존재가 아니라 deployer -> socket-proxy -> Docker 도달성을 검증한다
          # (socket-proxy에는 healthcheck가 없어 up -d는 crash-loop을 그대로 통과시킨다).
          # 비부트스트랩 경로에서는 위 up -d 직후라 갓 생성된 socket-proxy가 아직 바인드
          # 전일 수 있어 짧게 재시도한다.
          socket_proxy_reachable=false
          for ((attempt=1; attempt<=3; attempt++)); do
            if docker_exec_bounded "$WORKFLOW_DEADLINE" 30 opensamguk-deployer docker version >/dev/null; then
              socket_proxy_reachable=true
              break
            fi
            if ! bounded_sleep "$WORKFLOW_DEADLINE" 2; then
              break
            fi
          done
          if [ "$socket_proxy_reachable" != true ]; then
            echo "::error::deployer cannot reach Docker through socket-proxy; leaving maintenance marker closed"
            exit 1
          fi

          if ! ensure_lifecycle_recovery; then
            exit 1
          fi

          validate_start_input

          if [ -n "$IMAGE_TAG" ]; then
            run_bounded "$WORKFLOW_DEADLINE" 30 sudo sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" "$ENV_FILE"
            if run_bounded "$WORKFLOW_DEADLINE" 15 sudo grep -q '^WEB_GAME_TAG=' "$ENV_FILE"; then
              run_bounded "$WORKFLOW_DEADLINE" 30 sudo sed -i "s/^WEB_GAME_TAG=.*/WEB_GAME_TAG=${IMAGE_TAG}/" "$ENV_FILE"
            else
              printf 'WEB_GAME_TAG=%s\n' "$IMAGE_TAG" | run_bounded "$WORKFLOW_DEADLINE" 30 sudo tee -a "$ENV_FILE" >/dev/null
            fi
          fi

          run_bounded "$WORKFLOW_DEADLINE" 600 sudo docker compose -p "$PROJECT" \
            --env-file "$ENV_FILE" \
            -f docker-compose.server.yml \
            up -d

          run_bounded "$WORKFLOW_DEADLINE" 300 sudo docker compose -p opensamguk-shared \
            -f docker-compose.shared.yml \
            --env-file .env \
            up -d --force-recreate --no-deps nginx

          server_ready=false
          for i in $(seq 1 90); do
            if ! deadline_remaining "$WORKFLOW_DEADLINE" >/dev/null; then
              break
            fi
            if run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-game-api$" &&
               run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-game-engine$" &&
               run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-web-game$" &&
               run_bounded "$WORKFLOW_DEADLINE" 15 curl -fsS --max-time 10 http://localhost/health | grep -q '"status":"up"' &&
               run_bounded "$WORKFLOW_DEADLINE" 15 curl -fsS --max-time 10 "http://localhost/game/${PUBLIC_ID}" >/dev/null; then
              server_ready=true
              break
            fi
            if ! bounded_sleep "$WORKFLOW_DEADLINE" 5; then
              break
            fi
          done

          if [ "$server_ready" != true ]; then
            echo "::error::server ${PUBLIC_ID} did not become ready"
            run_bounded "$WORKFLOW_DEADLINE" 15 sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            exit 1
          fi

          if ! MAINTENANCE_STATE="$(maintenance_response_state "$(maintenance_post /maintenance/leave)")" || [ "$MAINTENANCE_STATE" != open ]; then
            echo "::error::deployer maintenance barrier did not reopen after successful server start"
            exit 1
          fi
          echo "server ${PUBLIC_ID} is ready"
