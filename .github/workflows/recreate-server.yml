name: Recreate Game Server

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Public server id, e.g. pep"
        required: true
        default: "pep"
      server_name:
        description: "Display name"
        required: true
        default: "빼섭"
      generation:
        description: "Generation number"
        required: true
        default: "0"
      image_tag:
        description: "Optional opensamguk image tag; blank uses the shared pin"
        required: false
        default: ""
      scenario_code:
        description: "Scenario code"
        required: true
        default: "scenario_1010"
      game_api_port:
        description: "Host port for game-api"
        required: true
        default: "8101"
      web_game_port:
        description: "Host port for web-game"
        required: true
        default: "3101"

concurrency:
  group: recreate-game-server-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  recreate:
    runs-on: [self-hosted, gcp-prod]
    permissions:
      contents: read
    steps:
      - name: Sync orchestration repo on box
        run: |
          set -euo pipefail
          exec 9>/tmp/opensamguk-production.lock
          if ! flock -w 1800 9; then
            echo "::error::Timed out acquiring /tmp/opensamguk-production.lock after 1800 seconds"
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          git fetch --prune origin main
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::opensamguk-docker has local tracked changes; refusing to overwrite prod orchestration files"
            git status --short
            exit 1
          fi
          git merge --ff-only origin/main

      - name: Recreate server through deployer
        env:
          SERVER_ID: ${{ inputs.server_id }}
          SERVER_NAME: ${{ inputs.server_name }}
          GENERATION: ${{ inputs.generation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SCENARIO_CODE: ${{ inputs.scenario_code }}
          GAME_API_PORT: ${{ inputs.game_api_port }}
          WEB_GAME_PORT: ${{ inputs.web_game_port }}
        run: |
          set -euo pipefail
          exec 9>/tmp/opensamguk-production.lock
          if ! flock -w 1800 9; then
            echo "::error::Timed out acquiring /tmp/opensamguk-production.lock after 1800 seconds"
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          if [[ ! "$SERVER_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::invalid server_id; use non-empty ASCII alphanumeric public id"
            exit 1
          fi
          INTERNAL_ID="s${SERVER_ID}"
          echo "creating public server ${SERVER_ID} with internal Docker key ${INTERNAL_ID}"

          DEPLOYER_TOKEN="$(grep '^DEPLOYER_TOKEN=' .env | cut -d= -f2-)"
          test -n "$DEPLOYER_TOKEN"

          BODY="$(python3 -c 'import json, os; print(json.dumps({"id": os.environ["SERVER_ID"], "name": os.environ["SERVER_NAME"], "generation": os.environ["GENERATION"], "imageTag": os.environ["IMAGE_TAG"], "gameApiPort": os.environ["GAME_API_PORT"], "webGamePort": os.environ["WEB_GAME_PORT"], "scenarioCode": os.environ["SCENARIO_CODE"], "scenarioSeedEnabled": True, "jwtSecret": ""}, ensure_ascii=False))')"

          RESPONSE="$(sudo docker exec -i -e DEPLOYER_TOKEN="$DEPLOYER_TOKEN" opensamguk-deployer sh -c '
            cat > /tmp/recreate-server.json
            wget -qO- \
              --header="Authorization: Bearer $DEPLOYER_TOKEN" \
              --header="Content-Type: application/json" \
              --post-file=/tmp/recreate-server.json \
              http://localhost:9000/servers/create
          ' <<<"$BODY")"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'

      - name: Wait for server and route
        env:
          SERVER_ID: ${{ inputs.server_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SERVER_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::invalid server_id; use non-empty ASCII alphanumeric public id"
            exit 1
          fi
          PUBLIC_ID="$SERVER_ID"
          INTERNAL_ID="s${PUBLIC_ID}"
          for i in $(seq 1 90); do
            if sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-game-api$" &&
               sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-game-engine$" &&
               sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-web-game$" &&
               curl -fsS http://localhost/health | grep -q '"status":"up"' &&
               curl -fsS "http://localhost/game/${PUBLIC_ID}" >/dev/null; then
              echo "server ${PUBLIC_ID} is ready"
              exit 0
            fi
            sleep 5
          done

          echo "::error::server ${SERVER_ID} did not become ready"
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}'
          exit 1
