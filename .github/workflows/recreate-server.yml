name: Recreate Game Server

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Public server id (mixed case accepted, stored lowercase), e.g. pep"
        required: true
        default: "pep"
      server_name:
        description: "Display name"
        required: true
        default: "빼섭"
      generation:
        description: "Generation number"
        required: true
        default: "0"
      image_tag:
        description: "Optional opensamguk image tag; blank uses the shared pin"
        required: false
        default: ""
      scenario_code:
        description: "Scenario code"
        required: true
        default: "scenario_1010"
      game_api_port:
        description: "Host port for game-api"
        required: true
        default: "8101"
      web_game_port:
        description: "Host port for web-game"
        required: true
        default: "3101"

concurrency:
  group: recreate-game-server-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  recreate:
    runs-on: [self-hosted, gcp-prod]
    permissions:
      contents: read
    steps:
      - name: Synchronize, recreate, and verify server lifecycle
        env:
          SERVER_ID: ${{ inputs.server_id }}
          SERVER_NAME: ${{ inputs.server_name }}
          GENERATION: ${{ inputs.generation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SCENARIO_CODE: ${{ inputs.scenario_code }}
          GAME_API_PORT: ${{ inputs.game_api_port }}
          WEB_GAME_PORT: ${{ inputs.web_game_port }}
        run: |
          set -euo pipefail
          exec 9>/tmp/opensamguk-production.lock
          if ! flock -w 1800 9; then
            echo "::error::Timed out acquiring /tmp/opensamguk-production.lock after 1800 seconds"
            exit 1
          fi
          STACK="$HOME/opensamguk-docker"
          cd "$STACK"

          git fetch --prune origin main
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::opensamguk-docker has local tracked changes; refusing to overwrite prod orchestration files"
            git status --short
            exit 1
          fi
          git merge --ff-only origin/main

          RAW_SERVER_ID="$SERVER_ID"
          if [[ ! "$RAW_SERVER_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::invalid server_id; use non-empty ASCII alphanumeric public id"
            exit 1
          fi
          PUBLIC_ID="$(printf '%s' "$RAW_SERVER_ID" | tr '[:upper:]' '[:lower:]')"
          if (( ${#PUBLIC_ID} > 48 )); then
            echo "::error::server_id must be at most 48 ASCII alphanumeric characters"
            exit 1
          fi
          case "$PUBLIC_ID" in
            all|admin1|admin2|admin5|admin7|admin8|auction|battle-center|betting|board|chief-center|city|coming-soon|diplomacy|generals|global-diplomacy|history|inherit|join|mailbox|main|map|my|my-boss|my-cities|my-generals|my-nation|nation|nation-betting|nation-finance|npc-control|rankings|register|select-pool|simulator|tournament|tournament-admin|troop|vote|world-log)
              echo "::error::server_id ${PUBLIC_ID} is reserved for a game route or all-server operation"
              exit 1
              ;;
          esac
          export SERVER_ID="$PUBLIC_ID"
          INTERNAL_ID="s${PUBLIC_ID}"
          echo "creating public server ${PUBLIC_ID} with internal Docker key ${INTERNAL_ID}"

          DEPLOYER_TOKEN="$(grep '^DEPLOYER_TOKEN=' .env | cut -d= -f2-)"
          test -n "$DEPLOYER_TOKEN"

          export CLIENT_OPERATION_ID="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          BODY="$(python3 -c 'import json, os; print(json.dumps({"id": os.environ["SERVER_ID"], "name": os.environ["SERVER_NAME"], "generation": os.environ["GENERATION"], "imageTag": os.environ["IMAGE_TAG"], "gameApiPort": os.environ["GAME_API_PORT"], "webGamePort": os.environ["WEB_GAME_PORT"], "scenarioCode": os.environ["SCENARIO_CODE"], "scenarioSeedEnabled": True, "jwtSecret": "", "operationId": os.environ["CLIENT_OPERATION_ID"]}, ensure_ascii=False))')"

          lifecycle_status() {
            local target_job_id="$1"
            local attempt job_response job_status
            local malformed=false
            for attempt in 1 2 3; do
              if job_response="$(sudo docker exec -e DEPLOYER_TOKEN="$DEPLOYER_TOKEN" opensamguk-deployer sh -c '
                wget -qO- -T 10 -t 1 --header="Authorization: Bearer $DEPLOYER_TOKEN" "http://localhost:9000/jobs/$1"
              ' job "$target_job_id" 2>/dev/null)"; then
                if job_status="$(printf '%s' "$job_response" | JOB_ID="$target_job_id" python3 -c 'import json, os, sys; payload = json.load(sys.stdin); valid = isinstance(payload, dict) and set(payload) == {"id", "status"} and payload["id"] == os.environ["JOB_ID"] and payload["status"] in {"pending", "running", "succeeded", "failed", "cancelled"}; valid or sys.exit(1); print(payload["status"])' 2>/dev/null)"; then
                  printf '%s\n' "$job_status"
                  return 0
                fi
                malformed=true
              fi
              sleep 2
            done
            if [[ "$malformed" == true ]]; then
              return 2
            fi
            return 1
          }

          request_lifecycle_cancel() {
            local target_job_id="$1"
            local attempt cancel_response cancel_status
            for attempt in 1 2 3; do
              if cancel_response="$(sudo docker exec -e DEPLOYER_TOKEN="$DEPLOYER_TOKEN" opensamguk-deployer sh -c '
                wget -qO- -T 10 -t 1 \
                  --header="Authorization: Bearer $DEPLOYER_TOKEN" \
                  --post-data="" \
                  "http://localhost:9000/jobs/$1/cancel"
              ' job "$target_job_id" 2>/dev/null)" &&
                cancel_status="$(printf '%s' "$cancel_response" | JOB_ID="$target_job_id" python3 -c 'import json, os, sys; payload = json.load(sys.stdin); valid = isinstance(payload, dict) and set(payload) == {"id", "status"} and payload["id"] == os.environ["JOB_ID"] and payload["status"] in {"pending", "running", "succeeded", "failed", "cancelled"}; valid or sys.exit(1); print(payload["status"])' 2>/dev/null)"; then
                printf '%s\n' "$cancel_status"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          cancel_and_await_lifecycle_job() {
            local target_job_id="$1"
            local cancellation_confirmed=false
            local cancellation_warning_emitted=false
            local terminal_status=""
            while true; do
              if [[ "$cancellation_confirmed" != true ]]; then
                if request_lifecycle_cancel "$target_job_id" >/dev/null; then
                  cancellation_confirmed=true
                elif [[ "$cancellation_warning_emitted" != true ]]; then
                  echo "::warning::lifecycle job cancellation could not be confirmed; continuing to drain" >&2
                  cancellation_warning_emitted=true
                fi
              fi
              if terminal_status="$(lifecycle_status "$target_job_id")"; then
                case "$terminal_status" in
                  succeeded|failed|cancelled)
                    printf '%s\n' "$terminal_status"
                    return 0
                    ;;
                esac
              fi
              sleep 5
            done
          }

          JOB_ID=""
          LIFECYCLE_TERMINAL=false
          LIFECYCLE_DRAINING=false
          drain_lifecycle_before_unlock() {
            local exit_status="$?"
            if [[ -n "$JOB_ID" && "$LIFECYCLE_TERMINAL" != true && "$LIFECYCLE_DRAINING" != true ]]; then
              LIFECYCLE_DRAINING=true
              cancel_and_await_lifecycle_job "$JOB_ID" >/dev/null
              LIFECYCLE_TERMINAL=true
            fi
            return "$exit_status"
          }
          trap drain_lifecycle_before_unlock EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          while [[ -z "$JOB_ID" ]]; do
            for create_attempt in 1 2 3; do
              if RESPONSE="$(sudo docker exec -i -e DEPLOYER_TOKEN="$DEPLOYER_TOKEN" opensamguk-deployer sh -c '
                cat > /tmp/recreate-server.json
                wget -qO- \
                  --header="Authorization: Bearer $DEPLOYER_TOKEN" \
                  --header="Content-Type: application/json" \
                  --post-file=/tmp/recreate-server.json \
                  http://localhost:9000/servers/create
              ' <<<"$BODY" 2>/dev/null)" &&
                JOB_ID="$(printf '%s' "$RESPONSE" | python3 -c 'import json, re, sys; payload = json.load(sys.stdin); job_id = payload.get("jobId") if isinstance(payload, dict) else None; (isinstance(job_id, str) and re.fullmatch(r"[a-f0-9]{32}", job_id) is not None) or sys.exit(1); print(job_id)' 2>/dev/null)"; then
                break
              fi
              JOB_ID=""
              sleep 2
            done
            if [[ -z "$JOB_ID" ]]; then
              echo "::warning::server creation response remained unavailable; retrying idempotently"
              sleep 5
            fi
          done

          deadline=$((SECONDS + 1200))
          while true; do
            if JOB_STATUS="$(lifecycle_status "$JOB_ID")"; then
              case "$JOB_STATUS" in
                succeeded)
                  LIFECYCLE_TERMINAL=true
                  break
                  ;;
                pending|running|cancelled)
                  if [[ "$JOB_STATUS" == cancelled ]]; then
                    LIFECYCLE_TERMINAL=true
                    echo "::error::lifecycle job cancelled"
                    exit 1
                  fi
                  ;;
                failed)
                  LIFECYCLE_TERMINAL=true
                  echo "::error::lifecycle job failed"
                  exit 1
                  ;;
              esac
            else
              lookup_status=$?
              if (( lookup_status == 2 )); then
                echo "::warning::lifecycle job returned malformed status responses; retrying"
              else
                echo "::warning::lifecycle job lookup remained unavailable; retrying"
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::lifecycle job did not succeed within 20 minutes; requesting cancellation"
              terminal_status="$(cancel_and_await_lifecycle_job "$JOB_ID")"
              LIFECYCLE_TERMINAL=true
              echo "::error::lifecycle job reached terminal status ${terminal_status} after deadline"
              exit 1
            fi
            sleep 5
          done

          for i in $(seq 1 90); do
            if sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-game-api$" &&
               sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-game-engine$" &&
               sudo docker ps --format '{{.Names}}' | grep -q "^${INTERNAL_ID}-web-game$" &&
               curl -fsS http://localhost/health | grep -q '"status":"up"' &&
               curl -fsS "http://localhost/game/${PUBLIC_ID}" >/dev/null; then
              echo "server ${PUBLIC_ID} is ready"
              exit 0
            fi
            sleep 5
          done

          echo "::error::server ${PUBLIC_ID} did not become ready"
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}'
          exit 1
