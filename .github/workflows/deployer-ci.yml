name: Deployer CI

on:
  pull_request:
    paths:
      - "deployer/**"
      - "scripts/build-d101-candidate-images.py"
      - "scripts/build-d101-host-artifacts.py"
      - "scripts/test_build_d101_host_artifacts.py"
      - ".github/workflows/build-d101-candidate-images.yml"
      - "scripts/deploy-orchestration-admission-test.sh"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"
  push:
    branches: [main]
    paths:
      - "deployer/**"
      - "scripts/build-d101-candidate-images.py"
      - "scripts/build-d101-host-artifacts.py"
      - "scripts/test_build_d101_host_artifacts.py"
      - ".github/workflows/build-d101-candidate-images.yml"
      - "scripts/deploy-orchestration-admission-test.sh"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"

concurrency:
  group: deployer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4
      - name: runtime state is gitignored
        working-directory: .
        run: git check-ignore -q --no-index servers/.deployer-operations.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: exact offline dependency source
        run: python3 ../scripts/build-d101-host-artifacts.py verify-dependencies --module .
      - name: go build
        env:
          GOENV: 'off'
          GOTOOLCHAIN: 'local'
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: '-mod=vendor'
        run: go build ./...
      - name: go vet
        env:
          GOENV: 'off'
          GOTOOLCHAIN: 'local'
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: '-mod=vendor'
        run: go vet ./...
      - name: go test
        env:
          GOENV: 'off'
          GOTOOLCHAIN: 'local'
          GOWORK: 'off'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: '-mod=vendor'
        run: go test ./...
      - name: deploy orchestration admission boundary
        working-directory: .
        run: bash scripts/deploy-orchestration-admission-test.sh
      - name: container build
        run: docker build --tag opensamguk-deployer:ci .
