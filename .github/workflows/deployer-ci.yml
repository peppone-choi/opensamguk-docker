name: Deployer CI

on:
  pull_request:
    paths:
      - "deployer/**"
      - "scripts/deploy-orchestration-admission-test.sh"
      - "scripts/direct_web_promotion.py"
      - "scripts/test_direct_web_promotion.py"
      - "scripts/web_game_candidate_probe.py"
      - "scripts/test_web_game_candidate_probe.py"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"
  push:
    branches: [main]
    paths:
      - "deployer/**"
      - "scripts/deploy-orchestration-admission-test.sh"
      - "scripts/direct_web_promotion.py"
      - "scripts/test_direct_web_promotion.py"
      - "scripts/web_game_candidate_probe.py"
      - "scripts/test_web_game_candidate_probe.py"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"

concurrency:
  group: deployer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4
      - name: runtime state is gitignored
        working-directory: .
        run: git check-ignore -q --no-index servers/.deployer-operations.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: deployer/go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: deploy orchestration admission boundary
        working-directory: .
        run: bash scripts/deploy-orchestration-admission-test.sh
      - name: web operation tool contracts
        working-directory: .
        run: |
          python3 - <<'PYTHON'
          import pathlib, sys, unittest
          suite = unittest.TestSuite()
          for name in ("direct_web_promotion", "web_game_candidate_probe"):
              source = pathlib.Path("scripts") / (name + ".py")
              test = pathlib.Path("scripts") / ("test_" + name + ".py")
              if not source.exists() and not test.exists():
                  continue
              if not source.is_file() or not test.is_file():
                  sys.exit("web operation source/test pair is incomplete")
              discovered = unittest.defaultTestLoader.discover("scripts", pattern=test.name)
              if discovered.countTestCases() == 0:
                  sys.exit("web operation contract tests were not discovered")
              suite.addTests(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PYTHON
      - name: container build
        run: docker build --tag opensamguk-deployer:ci .
