name: Deployer CI

on:
  pull_request:
    paths:
      - "deployer/**"
      - "scripts/deploy-orchestration-admission-test.sh"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"
  push:
    branches: [main]
    paths:
      - "deployer/**"
      - "scripts/deploy-orchestration-admission-test.sh"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"

concurrency:
  group: deployer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4
      - name: runtime state is gitignored
        working-directory: .
        run: git check-ignore -q --no-index servers/.deployer-operations.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: deployer/go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: deploy orchestration admission boundary
        working-directory: .
        run: bash scripts/deploy-orchestration-admission-test.sh
      - name: container build
        run: docker build --tag opensamguk-deployer:ci .
