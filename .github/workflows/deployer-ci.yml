name: Deployer CI

on:
  pull_request:
    paths:
      - "deployer/**"
      - "scripts/deploy-orchestration-admission-test.sh"
      - "scripts/test_web_game_promotion.py"
      - "scripts/web_game_native_probe.py"
      - ".github/workflows/promote-web-game.yml"
      - "docker-compose.server.yml"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"
  push:
    branches: [main]
    paths:
      - "deployer/**"
      - "scripts/deploy-orchestration-admission-test.sh"
      - "scripts/test_web_game_promotion.py"
      - "scripts/web_game_native_probe.py"
      - ".github/workflows/promote-web-game.yml"
      - "docker-compose.server.yml"
      - ".github/workflows/deploy-orchestration.yml"
      - ".gitignore"
      - ".github/workflows/deployer-ci.yml"

concurrency:
  group: deployer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deployer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: runtime state is gitignored
        working-directory: .
        run: git check-ignore -q --no-index servers/.deployer-operations.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: deployer/go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: web-game workflow contract
        working-directory: .
        run: python3 scripts/test_web_game_promotion.py
      - name: web-game native race, guard mutations and Compose digest config
        working-directory: .
        run: python3 scripts/web_game_native_probe.py
      - name: web-game native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-game-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-game-native/
          if-no-files-found: warn
          retention-days: 7
      - name: deploy orchestration admission boundary
        working-directory: .
        run: bash scripts/deploy-orchestration-admission-test.sh
      - name: container build
        run: docker build --tag opensamguk-deployer:ci .
